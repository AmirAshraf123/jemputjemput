# Keeps a free Supabase project from pausing after a week without visitors.
# Runs every 3 days and makes one tiny database request.
# Setup: README step 6, option C.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 1 */3 * *"   # 01:17 UTC every 3 days (09:17 Singapore time)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/invitations?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase answered with HTTP $code"
          test "$code" = "200"
