# Netlify settings.
# Skip deploying when a push only changes files the live site doesn't use (the database files, docs,
# the README or GitHub workflows). On the free plan each production deploy uses credits, so this saves them.
# Netlify skips the deploy when this command succeeds, which is when nothing else changed.
[build]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude).github' ':(exclude)docs' ':(exclude)supabase' ':(exclude)README.md' ':(exclude)LICENSE'"
